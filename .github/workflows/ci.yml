name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Minimum env for `import config` / `import bot` to succeed under pytest.
      # These are dummy values — real secrets stay in GitHub Actions Secrets and
      # are only injected for the deploy workflow, not for tests.
      TELEGRAM_BOT_TOKEN: "test-token"
      DB_PATH: ":memory:"
      WEBAPP_SECRET: "ci-secret-not-used"
      WEBAPP_BASE_URL: ""
      TELEGRAM_CHANNEL_ID: ""
      BOOTSTRAP_ADMIN_EMAIL: ""
      BOOTSTRAP_ADMIN_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check .

      - name: Run tests
        run: pytest -q --maxfail=1 --disable-warnings --cov=. --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
