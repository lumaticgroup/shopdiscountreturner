name: Deploy

# Manual deploy hook. Also runs on any push to main *after* CI is green.
# This workflow is where GitHub Actions Secrets (like WEBAPP_BASE_URL,
# TELEGRAM_BOT_TOKEN, WEBAPP_SECRET) get materialised into a runtime .env or
# forwarded to your host. Replace the "Deploy" step body with whatever fits
# your target (ssh + systemd, Railway, Fly, Render, Docker registry push, ...).

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy bot
    runs-on: ubuntu-latest
    # Gate on CI. Requires the CI workflow to have succeeded on this SHA.
    needs: []
    environment:
      name: production
      # Optional: link to your public Mini App URL for one-click access in the
      # Actions run summary. Falls back to the empty string.
      url: ${{ secrets.WEBAPP_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compose runtime .env from Secrets
        # Materialise the .env the bot reads at startup from GitHub Actions
        # Secrets. Add repository secrets under:
        #   Settings → Secrets and variables → Actions → New repository secret
        # Required secrets:  TELEGRAM_BOT_TOKEN, WEBAPP_SECRET, WEBAPP_BASE_URL
        # Optional secrets:  TELEGRAM_CHANNEL_ID, BOOTSTRAP_ADMIN_EMAIL,
        #                    BOOTSTRAP_ADMIN_PASSWORD
        run: |
          cat > .env <<'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBAPP_SECRET=${{ secrets.WEBAPP_SECRET }}
          WEBAPP_BASE_URL=${{ secrets.WEBAPP_BASE_URL }}
          WEBAPP_HOST=0.0.0.0
          WEBAPP_PORT=8000
          TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}
          CHANNEL_MIN_DISCOUNT_PCT=35
          CHANNEL_POST_RATE_PER_MIN=20
          BOOTSTRAP_ADMIN_EMAIL=${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD=${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          DB_PATH=trendyol.db
          DAILY_DIGEST_HOUR=9
          DAILY_DIGEST_MINUTE=0
          MAX_PAGES_PER_CATEGORY=5
          SCRAPER_CONCURRENCY=3
          DIGEST_TOP_N=20
          PAGE_SIZE=10
          DEFAULT_STOREFRONT=tr
          SCRAPE_CACHE_SECONDS=600
          SESSION_TTL_HOURS=168
          EOF
          echo "Composed .env with $(wc -l < .env) lines"

      - name: Deploy
        # Replace this block with your actual deploy strategy. Examples:
        #
        #   # Option A — SSH to a VPS running systemd
        #   uses: appleboy/ssh-action@v1.2.0
        #   with:
        #     host: ${{ secrets.DEPLOY_HOST }}
        #     username: ${{ secrets.DEPLOY_USER }}
        #     key: ${{ secrets.DEPLOY_SSH_KEY }}
        #     script: |
        #       cd /opt/shopdiscountreturner
        #       git pull
        #       systemctl --user restart shopdiscount-bot
        #
        #   # Option B — Railway
        #   run: |
        #     curl -fsSL https://railway.app/install.sh | sh
        #     railway up --service bot --token ${{ secrets.RAILWAY_TOKEN }}
        #
        #   # Option C — Fly.io
        #   uses: superfly/flyctl-actions/setup-flyctl@master
        #   run: flyctl deploy --remote-only
        #     env:
        #       FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "TODO: wire up your deploy target here."
          echo "The .env is composed. Ship the working directory to your host."
