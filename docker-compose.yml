version: '3.8'

services:
  discount-bot:
    build: .
    container_name: discount-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/data/discounts.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    # Resource boundaries: prevents Playwright Chromium memory exhaustion
    mem_limit: 1536m
    # Security: No ports exposed to host. Telegram long-polling is strictly outbound.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
