<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Admin — Discount Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>Store admin</h1>
      <p class="subtitle" id="subtitle">Manage dynamic stores</p>
    </header>

    <section id="auth-warning" hidden class="error">
      You aren't logged in as an admin. <a href="/">Go to login</a>.
    </section>

    <section class="section">
      <h2>Stores</h2>
      <table class="store-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Flow</th>
            <th>Storefront</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="store-tbody">
          <tr><td colspan="5">Loading…</td></tr>
        </tbody>
      </table>
    </section>

    <section class="section">
      <h2 id="form-title">Add store</h2>
      <form id="store-form" autocomplete="off">
        <label>
          <span>Code (lowercase, digits, underscore)</span>
          <input name="code" required pattern="[a-z0-9_]+" />
        </label>
        <label>
          <span>Display name</span>
          <input name="display_name" required />
        </label>
        <div class="radio-group">
          <label><input type="radio" name="flow_type" value="api" checked /> API (plain JSON)</label>
          <label><input type="radio" name="flow_type" value="header" /> Header manipulation</label>
        </div>
        <label>
          <span>Base URL</span>
          <input name="base_url" required placeholder="https://example.com" />
        </label>
        <label>
          <span>Currency</span>
          <input name="currency" required placeholder="USD" maxlength="8" />
        </label>
        <label>
          <span>Storefront code</span>
          <input name="storefront_code" required pattern="[a-z0-9_]+" placeholder="example_us" />
        </label>
        <label>
          <span>Config JSON (list_url, fields, optional headers/cookies, pagination)</span>
          <textarea name="config" required></textarea>
        </label>
        <div class="btn-row">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="reset-btn" class="secondary">Reset</button>
        </div>
        <p id="form-error" class="error" hidden></p>
        <p id="form-success" class="success" hidden></p>
      </form>
    </section>

    <section class="section">
      <h2>Actions</h2>
      <div class="btn-row">
        <button type="button" id="reload-btn" class="secondary">Reload registry</button>
        <button type="button" id="publish-btn" class="primary">Publish ≥35% to channel</button>
      </div>
      <p id="action-result" class="success" hidden></p>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
